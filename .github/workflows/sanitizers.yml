name: Sanitizers

on:
  push:
  pull_request:

jobs:
  sanitizers:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        preset:
          - asan
          - ubsan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget cmake ninja-build

      - name: Install LLVM 23
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo apt-get install -y \
            clang-23 \
            lld-23 \
            libc++-23-dev \
            libc++abi-23-dev \
            libclang-rt-23-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DBSIM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure